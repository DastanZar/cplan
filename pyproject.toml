[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cplan"
version = "0.1.0"
description = "Continuous-batching scheduler simulator: iteration-level scheduling, prefill/decode mix, SLO attainment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["cplan"]

[tool.ruff]
line-length = 100
